name: Sync THINKCAR OCR fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-ocr-fix.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical artifact
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-6938-8210-bd22-5e4dc417079c/raw?se=2026-08-31T05%3A48%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=611c8fc2-933a-5895-baa7-3aacbb28e977&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T04%3A41%3A52Z&ske=2026-09-01T04%3A41%3A52Z&sks=b&skv=2026-02-06&sig=L%2BYC6eu3rXhx3%2BeDUAgKx52Yky3re0hKb6b3FLQP6Pw%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/a.zip
          rm -rf /tmp/a && mkdir -p /tmp/a
          unzip -q /tmp/a.zip -d /tmp/a
          node --check /tmp/a/thinkcar-mvp-deploy.js
          cp /tmp/a/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: update THINKCAR VIN OCR engine' || exit 0
          git push
