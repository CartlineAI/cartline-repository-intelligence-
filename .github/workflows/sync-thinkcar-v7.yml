name: Sync THINKCAR V7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-v7.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical V7 artifact
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-a718-81f4-906b-d9e652aec829/raw?se=2026-09-01T02%3A46%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=bf63cbec-cc10-54a9-bbef-9d9246050c60&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T23%3A16%3A35Z&ske=2026-09-01T23%3A16%3A35Z&sks=b&skv=2026-02-06&sig=SPG5Yfhsc4vA0A2w60clmIvftWKiP9n3FaZKfpqaA1U%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/v7.zip
          rm -rf /tmp/v7 && mkdir -p /tmp/v7
          unzip -q /tmp/v7.zip -d /tmp/v7
          node --check /tmp/v7/thinkcar-mvp-deploy.js
          cp /tmp/v7/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: publish core-native THINKCAR V7 job evidence model' || exit 0
          git push
