name: Sync THINKCAR V6 public mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-thinkcar-v6.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v4
      - name: Download canonical THINKCAR artifact
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5544-81f4-a49c-50b6545ed528/raw?se=2026-08-30T15%3A44%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=ddf18114-25c6-5d5a-b54d-cd7eea20e7cd&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T07%3A25%3A58Z&ske=2026-08-31T07%3A25%3A58Z&sks=b&skv=2026-02-06&sig=afNPmW1MvI/%2BVtapRYnQBBfed1FsJAW/c5iLE9zILpQ%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/thinkcar.zip
          rm -rf /tmp/thinkcar && mkdir -p /tmp/thinkcar
          unzip -q /tmp/thinkcar.zip -d /tmp/thinkcar
          test -s /tmp/thinkcar/thinkcar-mvp-deploy.js
          node --check /tmp/thinkcar/thinkcar-mvp-deploy.js
          mkdir -p deploy
          cp /tmp/thinkcar/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit public browser mirror
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          if git diff --cached --quiet; then
            echo 'Mirror already current.'
            exit 0
          fi
          git commit -m 'deploy: update THINKCAR MVP public browser mirror to V6'
          git push
