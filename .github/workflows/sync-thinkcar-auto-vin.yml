name: Sync THINKCAR final exact selector

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-auto-vin.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical artifact
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8058-81f5-b056-c8dab50f111c/raw?se=2026-08-31T12%3A41%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=8f71b71e-c84c-57dd-b92c-50904c7b8f5b&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T09%3A39%3A00Z&ske=2026-09-01T09%3A39%3A00Z&sks=b&skv=2026-02-06&sig=4Zp4dkRRPoZHm7HuPjFPJZ9NTdPfWdtd/BfYo7UUAi4%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/thinkcar.zip
          rm -rf /tmp/thinkcar && mkdir -p /tmp/thinkcar
          unzip -q /tmp/thinkcar.zip -d /tmp/thinkcar
          node --check /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'selector-live-fixes' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'cvi-engineering-actions' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'Email \*' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'Telefon' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'margin-left:-50vw' /tmp/thinkcar/thinkcar-mvp-deploy.js
          if grep -q 'Ce tester ai folosit' /tmp/thinkcar/thinkcar-mvp-deploy.js; then echo 'Optional tester field still present'; exit 1; fi
          mkdir -p deploy
          cp /tmp/thinkcar/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: publish THINKCAR final exact selector' || exit 0
          git push
