name: Sync THINKCAR DTC and symptom release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-auto-vin.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical artifact
        env:
          ARTIFACT_URL: 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-2314-820d-adf2-e28d60b26748/raw?se=2026-08-31T08%3A25%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=0544e740-7cbd-59b7-9c91-95f29808c072&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T06%3A52%3A42Z&ske=2026-09-01T06%3A52%3A42Z&sks=b&skv=2026-02-06&sig=aUFTgATWdt5biGKuH3smWKokzQoeH9uvyYipUl/bwa8%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/thinkcar.zip
          rm -rf /tmp/thinkcar && mkdir -p /tmp/thinkcar
          unzip -q /tmp/thinkcar.zip -d /tmp/thinkcar
          node --check /tmp/thinkcar/thinkcar-mvp-deploy.js
          mkdir -p deploy
          cp /tmp/thinkcar/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: publish THINKCAR DTC and symptom release' || exit 0
          git push
