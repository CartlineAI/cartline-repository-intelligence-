name: Sync THINKCAR Opera-verified selector fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-auto-vin.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical artifact
        env:
          ARTIFACT_URL: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-3f6c-81f9-87c3-084eaa89ea2c/raw?se=2026-08-31T12%3A02%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=20a0bad2-6ac9-5cdd-84f2-ec0798a27d2b&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T09%3A38%3A53Z&ske=2026-09-01T09%3A38%3A53Z&sks=b&skv=2026-02-06&sig=43arCcG%2Bh6Y1vRkdVGHxG/78r62ersIGil6WqXP8aYk%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/thinkcar.zip
          rm -rf /tmp/thinkcar && mkdir -p /tmp/thinkcar
          unzip -q /tmp/thinkcar.zip -d /tmp/thinkcar
          node --check /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'selector-live-fixes' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'BRAND_WORDS' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'Email \*' /tmp/thinkcar/thinkcar-mvp-deploy.js
          mkdir -p deploy
          cp /tmp/thinkcar/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: publish THINKCAR Opera-verified selector fixes' || exit 0
          git push
