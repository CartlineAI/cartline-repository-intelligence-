name: Sync THINKCAR Engineering cleanup and domain-safe symptom release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-auto-vin.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical artifact
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-8ed4-81f4-b60b-3bffbf3a5ebd/raw?se=2026-08-31T11%3A40%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=957da18c-d0f6-5974-bfc2-b837a25ce0b5&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T07%3A43%3A16Z&ske=2026-09-01T07%3A43%3A16Z&sks=b&skv=2026-02-06&sig=lokdBZip%2B33C2xFJ%2BEvlCnMfRTA%2BcsWAiPKTYP9GsTU%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/thinkcar.zip
          rm -rf /tmp/thinkcar && mkdir -p /tmp/thinkcar
          unzip -q /tmp/thinkcar.zip -d /tmp/thinkcar
          node --check /tmp/thinkcar/thinkcar-mvp-deploy.js
          mkdir -p deploy
          cp /tmp/thinkcar/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: publish THINKCAR Engineering cleanup and domain-safe symptom release' || exit 0
          git push
