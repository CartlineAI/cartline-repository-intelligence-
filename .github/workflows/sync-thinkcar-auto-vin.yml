name: Sync THINKCAR WPForms FluentSMTP release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-auto-vin.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical artifact
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7664-81f4-8541-e77a93e21c1e/raw?se=2026-08-31T10%3A08%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=dd0bb2d9-0f35-5f44-bb79-1670eab7d9b3&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T09%3A46%3A52Z&ske=2026-09-01T09%3A46%3A52Z&sks=b&skv=2026-02-06&sig=kyyIRB7aBn3nJUq6pa/0zfiVEEh6EmNIFDkQ7C6w7Qc%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/thinkcar.zip
          rm -rf /tmp/thinkcar && mkdir -p /tmp/thinkcar
          unzip -q /tmp/thinkcar.zip -d /tmp/thinkcar
          node --check /tmp/thinkcar/thinkcar-mvp-deploy.js
          mkdir -p deploy
          cp /tmp/thinkcar/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: publish THINKCAR WPForms FluentSMTP release' || exit 0
          git push
