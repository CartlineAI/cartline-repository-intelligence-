name: Sync THINKCAR Engineering three-field row

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-thinkcar-auto-vin.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical artifact
        env:
          ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-5564-8243-9967-cd0c9afee87a/raw?se=2026-08-31T12%3A31%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=bdd2c570-e8df-5c36-b60d-2ecf93dd9a90&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T09%3A54%3A51Z&ske=2026-09-01T09%3A54%3A51Z&sks=b&skv=2026-02-06&sig=%2Bx1vicQFsx2ssrQgVTCk6Zufe6AiROTa6g5zCecik/8%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/thinkcar.zip
          rm -rf /tmp/thinkcar && mkdir -p /tmp/thinkcar
          unzip -q /tmp/thinkcar.zip -d /tmp/thinkcar
          node --check /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'selector-live-fixes' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'cvi-engineering-fields' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'Ce tester ai folosit' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'Email \*' /tmp/thinkcar/thinkcar-mvp-deploy.js
          grep -q 'Telefon' /tmp/thinkcar/thinkcar-mvp-deploy.js
          mkdir -p deploy
          cp /tmp/thinkcar/thinkcar-mvp-deploy.js deploy/thinkcar-mvp.js
      - name: Commit mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/thinkcar-mvp.js
          git commit -m 'deploy: publish THINKCAR Engineering three-field row' || exit 0
          git push
